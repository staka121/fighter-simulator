name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, pack, and release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      # Guard against tagging without bumping: tag v1.2.3 must match app.json 1.2.3.
      - name: Check tag matches app.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./app.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag}) does not match app.json version ${ver}"
            exit 1
          fi

      # tsc + vite build, then evenhub pack app.json dist -> out.ehpk
      - run: npm run pack
      - run: mv out.ehpk "fighter-hud-${GITHUB_REF_NAME}.ehpk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "fighter-hud-${GITHUB_REF_NAME}.ehpk" \
            --title "Fighter HUD ${GITHUB_REF_NAME#v}" \
            --generate-notes
